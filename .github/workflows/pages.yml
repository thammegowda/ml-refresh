name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deployment in progress; superseded pull-request runs may stop early.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Hosted runners are small (4 vCPUs), so the work is split across jobs that run at the same
# time: unit tests, and a site build whose output three browser-test shards share.
jobs:
  test:
    name: Unit and notebook tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby (for Asciidoctor)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Asciidoctor and Rouge
        run: gem install asciidoctor rouge

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jupyter/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r jupyter/requirements.txt
          npm ci

      - name: Cache Pyodide packages
        uses: actions/cache@v4
        with:
          path: node_modules/pyodide/*.whl
          key: pyodide-test-${{ hashFiles('package-lock.json') }}

      - name: Test
        run: npm test

  build:
    name: Build the site and PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby (for Asciidoctor)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Asciidoctor and Rouge
        run: gem install asciidoctor rouge

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jupyter/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r jupyter/requirements.txt
          npm ci

      - name: Cache Pyodide packages
        uses: actions/cache@v4
        with:
          path: |
            node_modules/pyodide/*.whl
            node_modules/pyodide-notebook/*.whl
          key: pyodide-build-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (for the PDF)
        run: npx playwright install --with-deps chromium

      - name: Build the site
        run: npm run build

      - name: Print the PDF
        run: npm run pdf

      - name: Package the site for browser tests
        run: tar -cf site.tar dist

      - name: Upload the site for browser tests
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tar
          compression-level: 1
          retention-days: 1

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  browser:
    name: Browser tests (${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download the site
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Browser tests
        run: |
          tar -xf site.tar
          npm run preview > preview.log 2>&1 &
          for attempt in $(seq 60); do
            curl -sf http://localhost:1414/ml-refresh/ > /dev/null && break
            sleep 1
          done
          npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload browser test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: |
            test-results/
            preview.log
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, build, browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
