<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 206" width="656" height="206" role="img" aria-labelledby="title description" font-family="'Trebuchet MS', 'DejaVu Sans', sans-serif" font-size="14">
  <title id="title">The LLM pipeline, from text to agents</title>
  <desc id="description">Six stages: text to tokens, architecture, and pretraining in the first row; post-training, inference, and agents with evaluation in the second row, each labelled with the chapters that cover it.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64716d"/></marker></defs>
  <rect x="20" y="20" width="176" height="58" rx="8" fill="#e6f2ee" stroke="#087f72" stroke-width="1.4"/>
  <text x="108.0" y="45" text-anchor="middle" font-weight="bold" fill="#202e2b">1. Text → tokens</text>
  <text x="108.0" y="64" text-anchor="middle" font-size="12" fill="#64716d">Ch. 17</text>
  <rect x="240" y="20" width="176" height="58" rx="8" fill="#e6f2ee" stroke="#087f72" stroke-width="1.4"/>
  <text x="328.0" y="45" text-anchor="middle" font-weight="bold" fill="#202e2b">2. Architecture</text>
  <text x="328.0" y="64" text-anchor="middle" font-size="12" fill="#64716d">Ch. 19–22, 24–28</text>
  <rect x="460" y="20" width="176" height="58" rx="8" fill="#e6f2ee" stroke="#087f72" stroke-width="1.4"/>
  <text x="548.0" y="45" text-anchor="middle" font-weight="bold" fill="#202e2b">3. Pretraining</text>
  <text x="548.0" y="64" text-anchor="middle" font-size="12" fill="#64716d">Ch. 15–16, 23, 29, 41</text>
  <rect x="460" y="128" width="176" height="58" rx="8" fill="#f6e6ed" stroke="#b04e75" stroke-width="1.4"/>
  <text x="548.0" y="153" text-anchor="middle" font-weight="bold" fill="#202e2b">4. Post-training</text>
  <text x="548.0" y="172" text-anchor="middle" font-size="12" fill="#64716d">Ch. 33, 35–38</text>
  <rect x="240" y="128" width="176" height="58" rx="8" fill="#fbf3e6" stroke="#a76613" stroke-width="1.4"/>
  <text x="328.0" y="153" text-anchor="middle" font-weight="bold" fill="#202e2b">5. Inference</text>
  <text x="328.0" y="172" text-anchor="middle" font-size="12" fill="#64716d">Ch. 24, 39–40</text>
  <rect x="20" y="128" width="176" height="58" rx="8" fill="#ece8f3" stroke="#6b5792" stroke-width="1.4"/>
  <text x="108.0" y="153" text-anchor="middle" font-weight="bold" fill="#202e2b">6. Agents &amp; evaluation</text>
  <text x="108.0" y="172" text-anchor="middle" font-size="12" fill="#64716d">Ch. 8, 42–43</text>
  <line x1="200" y1="49.0" x2="234" y2="49.0" stroke="#64716d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="420" y1="49.0" x2="454" y2="49.0" stroke="#64716d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="548.0" y1="82" x2="548.0" y2="122" stroke="#64716d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="456" y1="157.0" x2="422" y2="157.0" stroke="#64716d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="236" y1="157.0" x2="202" y2="157.0" stroke="#64716d" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
